name: CI

# Automatic CI disabled — run manually from Actions → CI → Run workflow.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check proto matches mtdd_server
        env:
          MTDD_PROTO_REF: 765da450c4ae09fefd0dcf57f98e560033870803
        run: |
          chmod +x scripts/sync-proto.sh
          cp proto/mtdd.proto proto/mtdd.proto.bak
          ./scripts/sync-proto.sh || true
          if ! diff -q proto/mtdd.proto proto/mtdd.proto.bak; then
            echo "::error::proto/mtdd.proto is out of sync with mtdd_server@main. Run scripts/sync-proto.sh"
            exit 1
          fi
