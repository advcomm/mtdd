# Local lab: vanilla pg → HAP GW → mtdd-proxy → HAP shard → Postgres
#
# HAProxy is TCP only (`option pgsql-check`). It does not parse SQL or tid.
# TLS is optional; when enabled, mtdd-proxy must reuse backend connections
# (no per-query TLS). This file is plain TCP.

global
    maxconn 256
    stats socket /tmp/mtdd-haproxy.sock mode 600 level admin
    log stdout format raw local0

defaults
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout check 5s

# Gateway VIP: apps set DB_HOST=127.0.0.1 DB_PORT=15432
frontend gw_in
    bind 127.0.0.1:15432
    mode tcp
    option tcplog
    tcp-request inspect-delay 2s
    tcp-request content capture req.payload(0,256) len 256
    log-format "HAPROXY_GW client=%ci:%cp backend=%si:%sp bytes_in=%U bytes_out=%B first_payload=%[capture.req.hdr(0)]"
    default_backend gw_out

backend gw_out
    mode tcp
    option pgsql-check user postgres
    server mtddproxy 127.0.0.1:6432 check inter 2s fall 2 rise 1

# Per-shard VIPs (proxy config, not the app)
frontend shard0_in
    bind 127.0.0.1:15442
    mode tcp
    option tcplog
    default_backend shard0_out

backend shard0_out
    mode tcp
    option pgsql-check user postgres
    server pg0 127.0.0.1:5432 check inter 2s fall 2 rise 1

frontend shard1_in
    bind 127.0.0.1:15443
    mode tcp
    option tcplog
    default_backend shard1_out

backend shard1_out
    mode tcp
    option pgsql-check user postgres
    server pg1 127.0.0.1:5432 check inter 2s fall 2 rise 1

frontend stats
    bind 127.0.0.1:15433
    mode http
    stats enable
    stats uri /stats
    stats refresh 2s
