syntax = "proto3";

package mtdd;

// Shard-side gRPC service. Each instance runs on a DB_HOST IP and receives
// host_index so it knows which shard it represents.
service MtddShard {
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
}

message ConnectRequest {
  int32 host_index = 1;
  string database = 2;
  string user = 3;
  string password = 4;
  int32 port = 5;
}

message ConnectResponse {
  bool ok = 1;
  string message = 2;
}

message QueryRequest {
  int32 host_index = 1;
  string text = 2;
  string values_json = 3;
  string name = 4;
  string row_mode = 5;
  string session_id = 6;
}

message QueryResponse {
  bool ok = 1;
  string error = 2;
  string result_json = 3;
}

message DisconnectRequest {
  int32 host_index = 1;
}

message DisconnectResponse {
  bool ok = 1;
}
